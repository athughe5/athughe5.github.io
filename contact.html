<body>
    <div class="wrapper">
        <header>
            <div class="logo">
                <img src="images/ADDI ABROAD (2).png" alt="Addi Abroad Logo">
                <h1><a href="index.html">Addi Abroad</a></h1>

        <nav>

            </ul>
        </nav>
        <main>

            <h2 class="page-title">Join the Journey!</h2>

            <p class="intro">
                Please fill out this form to get in touch, I'd love to hear from you!
            </p>

            <div class="form-card">

                <form action="#" method="post">

                    <label for="name">*Name:</label>
                    <input type="text" id="name" name="name" required>

                    <label for="email">*Email:</label>
                    <input type="email" id="email" name="email" required>

                    <label for="questions">Questions:</label>
                    <textarea id="questions" name="questions" rows="4"></textarea>

                    <label for="comments">Comments:</label>
                    <textarea id="comments" name="comments" rows="4"></textarea>

                    <label for="feedback">Feedback:</label>
                    <textarea id="feedback" name="feedback" rows="4"></textarea>

                    <label>
                        *Are you currently using this website to plan a vacation?
                    </label>

                    <div class="radio-group">

                        <label>
                            <input type="radio" name="vacation" value="yes" required>
                            Yes
                        </label>

                        <label>
                            <input type="radio" name="vacation" value="no">
                            No
                        </label>

                    </div>

                    <label for="destination">
                        If yes, what destination are you planning?
                    </label>

                    <input type="text" id="destination" name="destination">

                    <button type="button">Submit</button>

                </form>

            </div>

        </main>
    </div>

    <footer>
